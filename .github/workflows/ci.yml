name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Site + scan engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Required files, brand, scan engine
        run: node scripts/ci-check.mjs

      - name: Syntax-check scan.js + health Worker
        run: |
          node --check scan.js
          node --check workers/health.js
          node --check scripts/cf-pack.mjs

      - name: Pack Pages assets
        run: node scripts/cf-pack.mjs
