name: CD

# Primary production CD is Cloudflare Pages Git integration:
#   push to main → Pages build → https://optlyouts.awakyn.ai
# This workflow is the explicit CI/CD example:
#   1. Re-run CI on main (gate)
#   2. Direct-upload with Wrangler if CLOUDFLARE_API_TOKEN is set

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cd-production
  cancel-in-progress: true

jobs:
  ci:
    name: Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloudflare Pages
    needs: ci
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pages Git integration (default CD)
        run: |
          echo "Cloudflare Pages is connected to this repo."
          echo "Production URL: https://optlyouts.awakyn.ai"
          echo "A push to main already triggers a Pages deployment."

      - name: Optional Wrangler Direct Upload
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=optly-website --branch=main --commit-dirty=true
